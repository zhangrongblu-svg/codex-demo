<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个零依赖、可直接在浏览器运行的俄罗斯方块小游戏。"
    />
    <title>霓虹俄罗斯方块</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <section class="hero-panel">
        <p class="eyebrow">Tetromino Arcade</p>
        <h1 id="game-title">霓虹俄罗斯方块</h1>
        <p class="lead">
          旋转、下落、消行，挑战越来越快的节奏。支持键盘、触屏按钮与暂停续玩。
        </p>
        <div class="status-card" aria-live="polite">
          <span>当前状态</span>
          <strong id="game-status">准备开始</strong>
        </div>
        <button class="primary-action" id="start-button" type="button">开始游戏</button>
      </section>

      <section class="board-card" aria-label="俄罗斯方块游戏区域">
        <div class="canvas-wrap">
          <canvas id="tetris-board" width="300" height="600" aria-label="俄罗斯方块主棋盘"></canvas>
          <div class="overlay" id="board-overlay">
            <strong>点击开始</strong>
            <span>方向键移动 / ↑ 旋转 / 空格硬降</span>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="游戏信息与控制">
        <div class="stats-grid">
          <article>
            <span>分数</span>
            <strong id="score">0</strong>
          </article>
          <article>
            <span>等级</span>
            <strong id="level">1</strong>
          </article>
          <article>
            <span>消行</span>
            <strong id="lines">0</strong>
          </article>
          <article>
            <span>最高分</span>
            <strong id="best-score">0</strong>
          </article>
        </div>

        <div class="preview-card">
          <span>下一个</span>
          <canvas id="next-piece" width="120" height="120" aria-label="下一个方块预览"></canvas>
        </div>

        <div class="controls-card">
          <h2>操作方式</h2>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> 左右移动</li>
            <li><kbd>↓</kbd> 加速下落</li>
            <li><kbd>↑</kbd> 或 <kbd>X</kbd> 旋转</li>
            <li><kbd>Space</kbd> 硬降到底</li>
            <li><kbd>P</kbd> 暂停 / 继续</li>
          </ul>
        </div>

        <div class="touch-controls" aria-label="触屏控制按钮">
          <button type="button" data-action="left">←</button>
          <button type="button" data-action="rotate">⟳</button>
          <button type="button" data-action="right">→</button>
          <button type="button" data-action="down">↓</button>
          <button type="button" data-action="drop">硬降</button>
          <button type="button" data-action="pause">暂停</button>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
